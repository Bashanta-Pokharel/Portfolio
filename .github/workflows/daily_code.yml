name: Daily Code Practice Automation

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  generate-daily-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Code Generator
        run: |
          chmod +x ./scripts/daily_code_generator.py
          python3 ./scripts/daily_code_generator.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Daily Code Bot"
          git config --global user.email "bot@dailycode.local"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(daily-code): add 2 daily coding exercises [skip ci]"
            git push
          fi
