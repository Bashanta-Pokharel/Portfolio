<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo Calculator | Bashanta Pokharel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <header class="app-header">
    <a href="../index.html" class="back-link">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Portfolio</span>
    </a>
    <div class="app-title">
      <i class="fa-solid fa-calculator text-cyan"></i>
      <span>Neo Calculator</span>
    </div>
    <button class="history-toggle-btn" id="history-toggle" title="Toggle Calculation History" aria-label="Toggle History">
      <i class="fa-solid fa-clock-rotate-left"></i>
    </button>
  </header>

  <main class="calc-wrapper">
    <div class="calc-card">
      <!-- Calculator Display -->
      <div class="calc-display">
        <div class="calc-expression" id="calc-expression">0</div>
        <div class="calc-current" id="calc-current">0</div>
      </div>

      <!-- Calculator Keypad Grid -->
      <div class="calc-grid">
        <!-- Row 1: Memory / Special -->
        <button class="btn btn-func" data-action="clear" title="Clear (Escape)">AC</button>
        <button class="btn btn-func" data-action="delete" title="Backspace"><i class="fa-solid fa-delete-left"></i></button>
        <button class="btn btn-func" data-action="percent" title="Percentage">%</button>
        <button class="btn btn-op" data-action="op" data-val="/" title="Divide">&divide;</button>

        <!-- Row 2 -->
        <button class="btn btn-func" data-action="sqrt" title="Square Root">&radic;x</button>
        <button class="btn btn-func" data-action="power" title="Power">x&sup2;</button>
        <button class="btn btn-func" data-action="bracket" title="Parentheses">( )</button>
        <button class="btn btn-op" data-action="op" data-val="*" title="Multiply">&times;</button>

        <!-- Row 3: Numbers 7, 8, 9 & Minus -->
        <button class="btn btn-num" data-val="7">7</button>
        <button class="btn btn-num" data-val="8">8</button>
        <button class="btn btn-num" data-val="9">9</button>
        <button class="btn btn-op" data-action="op" data-val="-" title="Subtract">&minus;</button>

        <!-- Row 4: Numbers 4, 5, 6 & Plus -->
        <button class="btn btn-num" data-val="4">4</button>
        <button class="btn btn-num" data-val="5">5</button>
        <button class="btn btn-num" data-val="6">6</button>
        <button class="btn btn-op" data-action="op" data-val="+" title="Add">&#43;</button>

        <!-- Row 5: Numbers 1, 2, 3 & Equal span -->
        <button class="btn btn-num" data-val="1">1</button>
        <button class="btn btn-num" data-val="2">2</button>
        <button class="btn btn-num" data-val="3">3</button>
        <button class="btn btn-equal" data-action="equals" title="Calculate (Enter)">=</button>

        <!-- Row 6: Sign, 0, Dot -->
        <button class="btn btn-num" data-action="negate" title="Toggle Positive/Negative">&plusmn;</button>
        <button class="btn btn-num" data-val="0">0</button>
        <button class="btn btn-num" data-val="." title="Decimal">.</button>
      </div>
    </div>

    <!-- History Panel Overlay / Drawer -->
    <aside class="history-panel" id="history-panel">
      <div class="history-header">
        <h3><i class="fa-solid fa-clock-rotate-left"></i> History Tape</h3>
        <button class="clear-history-btn" id="clear-history" title="Clear History">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>
      <div class="history-list" id="history-list">
        <div class="empty-history">No calculation history yet.</div>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
